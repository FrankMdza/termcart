[package]
name = "termcart"
version = "0.1.0"
edition = "2021"
description = "Game Boy, Game Boy Color and Game Boy Advance in the terminal, on libretro cores"
license = "MIT"

[dependencies]
anyhow = "1"
base64 = "0.22"
cpal = "0.15"
crossterm = "0.28"
flate2 = "1"
libc = "0.2"
libloading = "0.8"
rtrb = "0.4.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
cc = "1.9.0"

[profile.profiling]
inherits = "release"
strip = false
debug = "line-tables-only"
